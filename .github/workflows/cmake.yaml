name: CMake

on: [ push, pull_request ]

env:
  BUILD_TYPE: Release
  MSYS: D:\msys2

jobs:
  build:
    strategy:
      matrix:

        os: [ ubuntu, macos, windows ]
        qt: [ "5.15.2", "6.9.3" ]

        include:
        - os: ubuntu
          generator: Unix Makefiles
          openssl_root: /usr
          artifact: build/xca-*-Linux.tar.gz
          host: linux
          runs: ubuntu-latest

        - os: macos
          generator: Unix Makefiles
          openssl_root: /opt/homebrew/opt/openssl
          artifact: build/xca-*.dmg
          host: mac
          runs: macos-latest

        - os: windows
          generator: MinGW Makefiles
          openssl_root: D:\msys2\msys64\mingw64
          openssl_perl: D:/msys2/msys64/usr/bin/perl.exe
          artifact: |
             build/xca-*.msi
             build/xca-portable-*.zip
          host: windows

        - os: windows
          qt: "5.15.2"
          winarch: win64_mingw81
          openssl_perl: D:/msys2/msys64/usr/bin/perl.exe
          runs: windows-latest

        exclude:
        - os: windows
          qt: "6.9.3"

        - os: macos
          qt: "5.15.2"

    runs-on: ${{matrix.runs}}

    steps:
    - name: Install Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Sphinx
      run: |
        python -m pip install --upgrade pip
        pip install sphinx

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        arch: ${{matrix.winarch}}
        version: ${{matrix.qt}}

    - name: Install MSYS2 and OpenSSL on Windows
      uses: msys2/setup-msys2@v2
      if: matrix.os == 'windows'
      with:
        location: ${{env.MSYS}}
        msystem: mingw64
        install: mingw-w64-x86_64-openssl openssl-devel base-devel mingw-w64-x86_64-gcc perl

    - name: Brew install OpenSSL
      if: matrix.os == 'macos'
      run: brew install openssl

    - name: Checkout XCA
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use the MSYS2 Perl for the bundled OpenSSL/Tongsuo (Windows)
      # OpenSSL/Tongsuo bakes the perl it was configured with into the generated
      # Makefile (`PERL = env('PERL') || $^X`). Header / err-string generation
      # then re-runs that perl on configdata.pm, which does `use Pod::Usage` and
      # friends at compile time, so the recorded interpreter must be a complete
      # perl. The `perl` on this runner's PATH is Git for Windows' minimal
      # msys-layout build, which lacks those core modules, and the build dies
      # with "Can't locate Pod/Usage.pm ... at configdata.pm". Switch to MSYS2's
      # own perl -- OpenSSL's NOTES-WINDOWS recommends exactly that for MinGW
      # builds -- and export PERL so Configure records it.
      if: matrix.os == 'windows'
      shell: pwsh
      run: |
        $perl = "${{ matrix.openssl_perl }}"
        "PERL=$perl" >> $env:GITHUB_ENV
        try { & $perl -MPod::Usage -e 'print qq{OpenSSL/Tongsuo will use perl: $^X\n}' }
        catch { Write-Warning $_ }

    - name: Configure
      # No YAML Multiline mechanism (>, |, \, >-, >+2 whatever) works as expected
      # Give up. Live with the long line
      # On Windows, run the bundled OpenSSL/Tongsuo "Configure" under MSYS2's
      # perl: OpenSSL records that interpreter into the Makefile as its PERL.
      run: cmake -B ${{github.workspace}}/build -G "${{matrix.generator}}" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DOPENSSL_ROOT_DIR=${{matrix.openssl_root}}${{ matrix.openssl_perl && format(' -DOPENSSL_CONFIGURE_TOOL={0}', matrix.openssl_perl) || '' }} --warn-uninitialized -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

    - name: Pin the OpenSSL/Tongsuo Makefile to the MSYS2 Perl (Windows)
      # Belt and braces: OpenSSL bakes `PERL = env('PERL') || $^X` into the
      # generated Makefile. Force the complete MSYS2 perl there so the header
      # generation rules (which `use Pod::Usage` etc. at compile time) work
      # whatever the runner resolved the interpreter to during Configure.
      if: matrix.os == 'windows'
      shell: pwsh
      run: |
        $mf = "${{ github.workspace }}/build/_deps/openssl-source-build/Makefile"
        $txt = [IO.File]::ReadAllText($mf)
        $txt = $txt -replace '(?m)^PERL=.*$', "PERL=${{ matrix.openssl_perl }}"
        [IO.File]::WriteAllText($mf, $txt)
        Select-String -Path $mf -Pattern '^PERL=' | ForEach-Object { $_.Line }

    - name: Build
      run: cmake --build ${{github.workspace}}/build -j 5 -v

    - name: Fixup after WindeployQT and Install
      if: matrix.os == 'windows'
      run: |
        cd ${{env.MSYS}}\msys64\mingw64\bin
        cmake -E copy libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll ${{github.workspace}}\build
        cmake --build ${{github.workspace}}/build -t install

    - name: Test
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: |
        cmake --build ${{github.workspace}}/build -t tests
        ctest --test-dir ${{github.workspace}}/build -L console

    - name: Install
      if: matrix.os != 'windows'
      run: DESTDIR=${{github.workspace}}/build/INSTALL cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -t install

    - name: Pack
      run: |
        cd ${{github.workspace}}/build
        cpack -C ${{env.BUILD_TYPE}}

    - name: Deploy
      uses: actions/upload-artifact@v4
      with:
        path: ${{matrix.artifact}}
        name: ${{matrix.os}}-${{matrix.qt}}
